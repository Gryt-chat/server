name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not the client's 24. The Dockerfile builds and runs on
          # node:22-bookworm and Release Server sets up 22, so testing on
          # anything newer would be testing something we do not ship.
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile

      # The reason this workflow exists. There are ten test files and 87 tests
      # in here, and until now nothing ran them on a pull request: the repo had
      # bump-gitlink, discord-ci-notify and vikunja-task-done and no CI at all.
      # server#53 merged with no automated verification beyond a local run.
      - run: yarn test

      # `build` is tsc. Named that way in package.json, but it is the
      # type check, and it is what stops a PR compiling only on the author's
      # machine.
      - run: yarn build

      # The whole repo, now that the flat config describes scripts/ too.
      # This was scoped to src/ when CI arrived, because 47 no-undef and
      # no-require-imports errors in two ad-hoc scripts would have failed the
      # job on day one. GRYT-309 fixed the config rather than the scripts.
      - run: npx eslint .
