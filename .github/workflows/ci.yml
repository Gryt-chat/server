name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not the client's 24: the Dockerfile and Release Server both use
          # it, so anything newer tests something we do not ship.
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile

      # The reason this workflow exists: ten test files and 87 tests that
      # nothing ran on a pull request.
      - run: yarn test

      # examples/ is what operators copy, and it runs against the same api
      # object, so a change to that surface breaks here.
      - run: yarn test:examples

      # `build` is tsc: the name is from package.json, but this is the type
      # check.
      - run: yarn build

      # The whole repo, now that the flat config describes scripts/ too.
      - run: npx eslint --flag unstable_native_nodejs_ts_config .

      # Code here is TypeScript so its types get checked (GRYT-1800). A file that has to stay
      # JavaScript goes in .js-allowlist, one path a line, with a # comment saying why.
      - name: No new JavaScript
        run: |
          allowed=$(grep -v '^#' .js-allowlist 2>/dev/null || true)
          found=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' | grep -vxF -e "$allowed" -e '' || true)
          if [ -n "$found" ]; then
            echo "::error::JavaScript not on .js-allowlist. Write it in TypeScript (GRYT-1800):"
            echo "$found"
            exit 1
          fi

      # Scripts and the lint config, which the build's tsconfig doesn't reach.
      - run: npx tsc -p scripts

      # No comment runs past two lines. The script carries the list of paths
      # still to be swept, and that list only ever shrinks.
      - run: node scripts/check-comment-length.mts

      # The bundles start the SFU on the host itself, so their config.env has to
      # keep its registration and metrics on 127.0.0.1 (GRYT-1264).
      - run: node scripts/check-selfhosted-config.mts
